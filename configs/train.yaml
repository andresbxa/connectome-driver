# Training configuration shared by every variant. Only the `model.core` section changes
# between variants (see configs/model/).

exp_name: baseline
seed: 1
device: cuda
run_dir: runs

env:
  frame_skip: 4
  frame_stack: 4
  resolution: 84
  reward_clip: 1.0          # training reward only; reported returns are unclipped
  lap_complete_percent: 0.95

ppo:
  total_steps: 1_000_000    # agent steps summed over envs (x frame_skip = env frames)
  num_envs: 8
  rollout_steps: 128        # per env -> batch of 1024 transitions
  num_minibatches: 4
  micro_batch_size: null    # split each minibatch to save GPU memory; the update is unchanged
  update_epochs: 4
  learning_rate: 2.5e-4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.1
  clip_value_loss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

model:
  # Encoder: pixels -> z, kept small so the core has to do the work.
  encoder:
    type: cnn
    channels: [16, 32, 32]
    feature_dim: 64
  # Graph shared by the experiment. Graph cores run on it; every variant (also the MLP) takes
  # its number of readout neurons from it, so the decoder is identical across variants.
  graph:
    processed_dir: data/processed
    subgraph_k: 3           # path subgraph visual afferents -> descending; null = whole brain
    variant: connectome     # connectome | rewired | random | block (null models)
    variant_seed: null      # null-model sample; null = use the run's seed
    swaps_per_edge: 10      # rewired / block: accepted double edge swaps per edge
    blocks: super_class     # block: neuron grouping (super_class | neuropil)
  # The decoder reads `readout_neurons` x `node_dim` states (the descending neurons).
  readout_neurons: auto
  node_dim: 8
  decoder:
    hidden_dim: 256
  core:
    type: mlp
    hidden_dims: [256, 256]

log:
  episode_csv: true
  checkpoint: true
