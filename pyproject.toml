[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-driver"
version = "0.1.0"
description = "The Drosophila connectome (FlyWire) as the core of a reinforcement-learning policy that learns to drive in CarRacing."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrés Bai" },
    { name = "Joshue Calero Tamayo" },
]
requires-python = ">=3.11"
dependencies = [
    # PyTorch is installed separately from the CUDA wheel index (see README).
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "omegaconf>=2.3",
    "gymnasium[box2d]>=1.0",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Sparse CSR tensor support is in beta state:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
