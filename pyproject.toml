[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-driver"
version = "0.1.0"
description = "The Drosophila connectome (FlyWire) as the core of a reinforcement-learning policy that learns to drive in CarRacing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "andresbxa" }]
requires-python = ">=3.11"
dependencies = [
    # PyTorch is installed separately from the CUDA wheel index (see README).
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "omegaconf>=2.3",
    "gymnasium[box2d]>=1.1",
    "opencv-python-headless>=4.8",  # used by gymnasium's ResizeObservation
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Sparse CSR tensor support is in beta state:UserWarning",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",  # Box2D (SWIG)
]

[tool.ruff]
line-length = 100
target-version = "py311"
